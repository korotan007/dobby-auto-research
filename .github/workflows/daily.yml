name: Dobby free daily research
on:
  schedule:
    - cron: '0 23 * * *' # 08:00 JST daily
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dobby-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Collect public RSS (Python standard library)
        run: python3 collect.py
      - name: Commit new results only
        run: |
          git config user.name "dobby-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update daily research snapshots"
            git push
          fi
